[package]
name = "smsg_ffi"
version = "0.1.0"
edition = "2024"
description = "Cross-language FFI (C ABI) for SoulMsg: message serialization and hashing."

[lib]
name = "smsg_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
smsg_core = { path = "../smsg_core" }
zenoh = "1.7"
zenoh-ext = { version = "1.7", features = ["internal"] }

[dev-dependencies]
soul_msg = { path = ".." }
zenoh = "1.7"
zenoh-ext = "1.7"

[build-dependencies]
cbindgen = "0.26"

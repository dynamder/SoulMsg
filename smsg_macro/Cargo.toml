[package]
name = "smsg_macro"
version = "0.3.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
smsg_core = { path = "../smsg_core" }
protox = "0.9"
prost-types = "0.14"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
heck = "0.5"

[dev-dependencies]
soul_msg = { path = ".." }
prost = "0.14"

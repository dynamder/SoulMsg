[package]
name = "proto_poc"
version = "0.1.0"
edition = "2024"
description = "Small-scale prototype: protobuf (prost) as the envelope payload instead of zenoh-ext encoding."
publish = false

[dependencies]
prost = "0.14"
prost-types = "0.14"
blake3 = "1.5"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
serde_json = "1"
